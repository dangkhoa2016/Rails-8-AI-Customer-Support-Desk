name: "Bug report (English)"
description: "Report a reproducible problem using synthetic data"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "🌐 English form · [Tiếng Việt](https://github.com/dangkhoa2016/Rails-8-AI-Customer-Support-Desk/issues/new/choose). Never include secrets or real customer data."
  - type: input
    id: revision
    attributes:
      label: Commit or version
      placeholder: "Git SHA / branch"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: "Use only fictional accounts, organizations and records."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Ruby, Rails, PostgreSQL, browser and sanitized logs."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: "I have removed credentials and all real customer data."
          required: true
