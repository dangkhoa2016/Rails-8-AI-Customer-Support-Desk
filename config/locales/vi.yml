    role_names:
      viewer: "Viewer · Chỉ xem"
      agent: "Agent · Nhân viên hỗ trợ"
      owner: "Owner · Quản lý"
    role_descriptions:
      viewer: "Xem tổng quan, khách hàng, ticket và KB công khai đã duyệt. Không tạo/sửa ticket, tra cứu nghiệp vụ dành riêng cho nhân viên, xem KB nháp hoặc dùng AI Search."
      agent: "Có quyền của Viewer, thêm tra cứu invoice/order phù hợp, tạo/cập nhật ticket, ghi chú và lưu phản hồi đã xác nhận thủ công. Chỉ xem KB đã duyệt; không duyệt KB."
      owner: "Có quyền Agent, thêm xem bản nháp, so sánh phiên bản KB VI/EN và thực hiện quy trình duyệt KB có xác nhận. AI không tự thay đổi nghiệp vụ."
    try_label: "Gợi ý test:"
    role_tests:
      viewer: "Mở Tickets và Knowledge Base; kiểm tra không có nút tạo ticket, AI Search hay so sánh KB."
      agent: "Mở chi tiết ticket để xem ô ghi chú/phản hồi, nút đổi trạng thái và liên kết invoice/order. AI Search chỉ hoạt động khi Modal được cấu hình."
      owner: "Mở Knowledge Base, chọn bài có bản nháp để xem so sánh VI/EN và giao diện duyệt. Không xác nhận duyệt khi chỉ đang xem demo."
