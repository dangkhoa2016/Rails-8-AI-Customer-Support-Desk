default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>
  host: <%= ENV.fetch('PGHOST', '127.0.0.1') %>
  port: <%= ENV.fetch('PGPORT', '5432') %>
  username: <%= ENV.fetch('PGUSER', 'support_desk') %>
  password: <%= ENV.fetch('PGPASSWORD', '') %>

development:
  <<: *default
  database: <%= ENV.fetch('PGDATABASE', 'rails8_ai_support_desk_development') %>

test:
  <<: *default
  database: <%= ENV.fetch('PGTESTDATABASE', 'rails8_ai_support_desk_test') %>

production:
  <<: *default
  database: <%= ENV.fetch('PGDATABASE', 'rails8_ai_support_desk_production') %>

# P0.3: dedicated isolated DB/role, guarded by config/environments/sandbox.rb.
sandbox:
  <<: *default
  database: <%= ENV.fetch('PGDATABASE', 'P03_SANDBOX_DATABASE_MISSING') %>
